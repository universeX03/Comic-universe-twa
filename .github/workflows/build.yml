name: Build Comic Universe TWA
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Node & Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version
      - name: Init TWA project
        run: |
          echo '{"version":1}' > bubblewrap-user-config.json
          bubblewrap init --manifest https://app.base44.com/apps/6a554529118de8791293ae9e/manifest.json --directory twa-project 2>&1 | head -5 || true
          ls -la
      - name: Build with Gradle directly
        working-directory: twa-project
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: comic-universe-aab
          path: twa-project/app/build/outputs/bundle/release/*.aab
